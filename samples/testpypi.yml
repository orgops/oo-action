name: OrgOps Topology From TestPyPI

on:
  workflow_dispatch:

jobs:
  topology:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: orgops/oo-action@v1
        with:
          command: topology
          path: .
          package-index-url: "https://test.pypi.org/simple/"
          extra-index-url: "https://pypi.org/simple/"
