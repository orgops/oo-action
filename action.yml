name: "OrgOps oo CLI"
description: "Run the OrgOps oo CLI in GitHub Actions workflows."
author: "OrgOps"

branding:
  icon: "activity"
  color: "blue"

inputs:
  command:
    description: "oo command to run: validate, topology, ownership, or assess."
    required: true
  path:
    description: "Repository path or file path passed to the oo command."
    required: false
    default: "."
  args:
    description: "Additional arguments passed after command and path."
    required: false
    default: ""
  oo-version:
    description: "Version of the Python package to install. Use 'latest' for the newest release."
    required: false
    default: "latest"
  package-name:
    description: "Python package name that provides the oo console script."
    required: false
    default: "orgops"
  python-version:
    description: "Python version used to install and run oo."
    required: false
    default: "3.12"
  package-index-url:
    description: "Optional package index URL for pre-release testing."
    required: false
    default: ""
  extra-index-url:
    description: "Optional extra Python package index URL."
    required: false
    default: ""
  install-extra-args:
    description: "Additional pip install flags."
    required: false
    default: ""
  skip-install:
    description: "Skip package installation when oo is already available on PATH."
    required: false
    default: "false"

outputs:
  result-path:
    description: "Path to the versioned JSON result produced by oo."
    value: ${{ steps.run-oo.outputs.result-path }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install oo
      if: ${{ inputs.skip-install != 'true' }}
      shell: bash
      env:
        OO_ACTION_PACKAGE_NAME: ${{ inputs.package-name }}
        OO_ACTION_OO_VERSION: ${{ inputs.oo-version }}
        OO_ACTION_PACKAGE_INDEX_URL: ${{ inputs.package-index-url }}
        OO_ACTION_EXTRA_INDEX_URL: ${{ inputs.extra-index-url }}
        OO_ACTION_INSTALL_EXTRA_ARGS: ${{ inputs.install-extra-args }}
      run: python "$GITHUB_ACTION_PATH/scripts/install-oo.py"

    - name: Run oo
      id: run-oo
      shell: bash
      env:
        OO_ACTION_COMMAND: ${{ inputs.command }}
        OO_ACTION_PATH: ${{ inputs.path }}
        OO_ACTION_ARGS: ${{ inputs.args }}
      run: python "$GITHUB_ACTION_PATH/scripts/run-oo.py"
