name: Test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  action:
    runs-on: [self-hosted, cpu]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate action metadata
        run: |
          python -m pip install pyyaml
          python - <<'PY'
          from pathlib import Path
          import yaml

          metadata = yaml.safe_load(Path("action.yml").read_text())
          assert "command" not in metadata["inputs"]
          assert metadata["inputs"]["oo-version"]["default"] == "0.1.0"
          assert "latest" not in metadata["inputs"]["oo-version"]["description"]
          assert set(metadata["outputs"]) == {
              "status", "result-path", "contract-digest", "failed-count", "unknown-count"
          }
          PY

      - name: Reject unpinned latest install
        env:
          OO_ACTION_OO_VERSION: latest
        run: |
          if python scripts/install-oo.py; then
            echo "install-oo.py accepted an unpinned latest version"
            exit 1
          fi

      - name: Provide failing fake oo command
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/oo" <<'SH'
          #!/usr/bin/env bash
          output=""
          while [ "$#" -gt 0 ]; do
            if [ "$1" = "--output" ]; then output="$2"; break; fi
            shift
          done
          printf '{"schema_version":"v1","command":"validate","result":{"status":"fail","exit_code":1,"contract":{"digest":"abc"},"summary":{"failed":2,"unknown":1}}}\n' > "$output"
          exit 1
          SH
          chmod +x "$RUNNER_TEMP/bin/oo"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Run action and preserve outputs on failure
        id: orgops
        continue-on-error: true
        uses: ./
        with:
          path: .
          contract: .orgops/contract.yaml
          skip-install: "true"

      - name: Check structured outputs
        env:
          RESULT_PATH: ${{ steps.orgops.outputs.result-path }}
          STATUS: ${{ steps.orgops.outputs.status }}
          DIGEST: ${{ steps.orgops.outputs.contract-digest }}
          FAILED: ${{ steps.orgops.outputs.failed-count }}
          UNKNOWN: ${{ steps.orgops.outputs.unknown-count }}
        run: |
          test -f "$RESULT_PATH"
          test "$STATUS" = "fail"
          test "$DIGEST" = "abc"
          test "$FAILED" = "2"
          test "$UNKNOWN" = "1"

      - name: Provide missing-result fake oo command
        run: |
          cat > "$RUNNER_TEMP/bin/oo" <<'SH'
          #!/usr/bin/env bash
          exit 3
          SH
          chmod +x "$RUNNER_TEMP/bin/oo"

      - name: Run action and expose execution error
        id: orgops-exec-error
        continue-on-error: true
        uses: ./
        with:
          path: .
          contract: .orgops/contract.yaml
          skip-install: "true"

      - name: Check execution error outputs
        env:
          RESULT_PATH: ${{ steps.orgops-exec-error.outputs.result-path }}
          STATUS: ${{ steps.orgops-exec-error.outputs.status }}
          FAILED: ${{ steps.orgops-exec-error.outputs.failed-count }}
          UNKNOWN: ${{ steps.orgops-exec-error.outputs.unknown-count }}
        run: |
          test -n "$RESULT_PATH"
          test "$STATUS" = "execution_error"
          test "$FAILED" = "0"
          test "$UNKNOWN" = "0"
