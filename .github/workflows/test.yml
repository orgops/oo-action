name: Test

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate action metadata
        run: |
          python -m pip install pyyaml
          python - <<'PY'
          from pathlib import Path
          import yaml

          metadata = yaml.safe_load(Path("action.yml").read_text())
          assert metadata["name"] == "OrgOps oo CLI"
          assert metadata["runs"]["using"] == "composite"
          assert set(["command", "path", "oo-version", "skip-install"]).issubset(metadata["inputs"])
          PY

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test runner command assembly
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/oo" <<'SH'
          #!/usr/bin/env bash
          echo "$@" > "$RUNNER_TEMP/oo-args.txt"
          SH
          chmod +x "$RUNNER_TEMP/bin/oo"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          PATH="$RUNNER_TEMP/bin:$PATH" \
            OO_ACTION_COMMAND=topology \
            OO_ACTION_PATH=. \
            OO_ACTION_ARGS="--branch main" \
            python scripts/run-oo.py
          test "$(cat "$RUNNER_TEMP/oo-args.txt")" = "topology . --branch main"

  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Provide fake oo command
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/oo" <<'SH'
          #!/usr/bin/env bash
          command="$1"
          target="${2:-.}"
          if [ "$command" = "topology" ]; then
            echo "# Fake topology report" > "$target/ORGOPS_TOPOLOGY_REPORT.md"
          fi
          echo "fake oo: $*"
          SH
          chmod +x "$RUNNER_TEMP/bin/oo"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Run action against sample repository
        uses: ./
        with:
          command: topology
          path: .
          skip-install: "true"

      - name: Check generated report
        run: test -f ORGOPS_TOPOLOGY_REPORT.md
